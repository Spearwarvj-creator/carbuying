<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Deal Desk thumbnail (1280 x 720)</title>
<link rel="stylesheet" href="kit.css">
<style>
  /* Same family as the Kurae thumbnail: dark dot grid, a big pixel mascot on the left, pixel headline on the right, the
     V2Stack | No. pill top right, and small floating chips with real numbers. Capture the 1280 x 720 frame at 100%. */
  html, body { background: #0b0a09; }
  .thumb { position: relative; width: 1280px; height: 720px; margin: 0 auto; background: #171412; overflow: hidden; }
  .thumb::before { content: ""; position: absolute; inset: 0; background-image: radial-gradient(rgba(245,243,239,.09) 1.5px, transparent 2px); background-size: 32px 32px; background-position: 16px 16px; }
  .thumb::after { content: ""; position: absolute; inset: 0; pointer-events: none; background: radial-gradient(700px 420px at 90% 0%, rgba(196,77,45,.22), transparent 70%), radial-gradient(900px 600px at 40% 50%, transparent 55%, rgba(0,0,0,.4) 100%); }
  .bar { position: absolute; left: 0; right: 0; height: 8px; background: var(--terra); z-index: 3; }
  .bar.t { top: 0; } .bar.b { bottom: 0; }
  #sprite { position: absolute; left: 30px; top: 90px; width: 560px; height: 600px; image-rendering: pixelated; z-index: 2; }
  .glow { position: absolute; left: 110px; top: 420px; width: 420px; height: 260px; background: radial-gradient(closest-side, rgba(94,230,208,.28), transparent); z-index: 1; }
  .pill { position: absolute; right: 36px; top: 30px; z-index: 3; display: flex; align-items: center; gap: 16px; padding: 7px 22px 7px 10px; border: 2px solid var(--terra); border-radius: 999px; background: rgba(23,20,18,.7); }
  .pill img { width: 40px; height: 40px; border-radius: 10px; }
  .pill .nm { font: 800 31px/1 var(--text); }
  .pill .d { width: 2px; height: 30px; background: var(--terra); opacity: .8; }
  .pill .no { font: 400 28px/1 var(--pixel); color: var(--terra-hi); }
  .h1, .h2 { position: absolute; left: 590px; z-index: 3; font-family: var(--pixel); font-weight: 700; text-transform: uppercase; line-height: 1; }
  .h1 { top: 140px; font-size: 92px; color: var(--cream); }
  .h2 { top: 246px; font-size: 92px; color: var(--terra-hi); }
  .sub { position: absolute; left: 594px; top: 368px; z-index: 3; font: 400 24px/1 var(--pixel); color: var(--dim); text-transform: uppercase; }
  .chip { position: absolute; z-index: 3; padding: 0; border: 3px solid; background: #1f1a17; font: 400 28px/1 var(--pixel); color: var(--cream); }
  .chip i { display: block; height: 14px; }
  .chip span { display: block; padding: 10px 16px 12px; }
  .chip.a { left: 600px; top: 470px; border-color: #4ade80; } .chip.a i { background: #4ade80; }
  .chip.b { left: 880px; top: 520px; border-color: var(--yellow); } .chip.b i { background: var(--yellow); }
  .chip.c { left: 760px; top: 610px; border-color: var(--teal); font-size: 22px; } .chip.c i { background: var(--teal); }
</style>
</head>
<body>
<div class="thumb">
  <div class="bar t"></div><div class="bar b"></div>
  <div class="glow"></div>
  <canvas id="sprite" width="28" height="30"></canvas>
  <div class="pill"><img src="assets/v2stack-icon.svg" alt=""><span class="nm">V2Stack</span><span class="d"></span><span class="no">NO. 6</span></div>
  <div class="h1">Pay less.</div>
  <div class="h2">Pay more.</div>
  <div class="sub">Deal Desk   Free   No account</div>
  <div class="chip a"><i></i><span>$491 A MONTH</span></div>
  <div class="chip b"><i></i><span>$44,246 TOTAL</span></div>
  <div class="chip c"><i></i><span>AI NEVER MAKES THE NUMBERS</span></div>
</div>
<script src="vee.js"></script>
<script>
  // Vee, drawn once from the same sprite the video uses. wow face with the lights on: the "wait, what" look.
  const face = { eyes: "wide", brow: "none", mouth: "o", blush: false, px: 0, py: 0, bright: true, flame: 1, fast: false };
  const c = document.getElementById("sprite");
  c.getContext("2d").drawImage(Vee.buildSprite(face), 0, 0);
</script>
</body>
</html>
